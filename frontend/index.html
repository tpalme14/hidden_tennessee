<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      M03-T03 decision 5 (amended 2026-11-18): every Referer this page sends is
      the bare origin — never a path or query, so a reset token can never leak
      through one. Not "no-referrer": OpenStreetMap's tile usage policy requires
      a Referer on tile requests. Guarded by frontend/src/referrerPolicy.test.ts
      and e2e/referrer-policy.spec.ts.
    -->
    <meta name="referrer" content="strict-origin" />
    <!-- M06-T02 Increment 1b: PWA metadata; the manifest link is injected at build time. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Tennessee Natural Landmarks Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
