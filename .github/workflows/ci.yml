name: CI

on:
  pull_request:
  push:
    branches: [main]

# No deployment step exists anywhere in this workflow. Production deployment
# is a deliberate manual action, performed separately once release
# infrastructure is provisioned (Specification 7 §10.1) — a push to main
# here runs tests only.

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: landmarks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/landmarks_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/landmarks_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=backend

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (landmarks_test only)
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Dependency audit (informational — not a merge gate)
        run: npm audit --audit-level=high
        continue-on-error: true

  # Non-blocking: broader regression coverage on merges to main. Currently
  # identical in content to the smoke suite above (there's only one e2e test
  # so far) — this job structurally exists per ADR-009 and will diverge as
  # real product journeys are added from Milestone 02 onward.
  regression:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: landmarks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/landmarks_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/landmarks_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
